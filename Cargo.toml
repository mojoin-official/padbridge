[package]
name = "padbridge"
version = "0.2.0"
edition = "2021"
description = "Remaps keyboard and mouse input to a virtual Xbox 360 (XInput) controller on Windows"
publish = false
default-run = "padbridge"

[lib]
name = "padbridge"
path = "src/lib.rs"

# The window app.
[[bin]]
name = "padbridge"
path = "src/gui/main.rs"
required-features = ["gui"]

# The console program (same engine, no window).
[[bin]]
name = "padbridge-cli"
path = "src/cli.rs"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
# Window toolkit for the app only; the mapping engine itself depends on nothing but std.
eframe = { version = "0.29.1", optional = true }

# Talks to the ViGEmBus driver; Windows-only.
[target.'cfg(windows)'.dependencies]
vigem-client = "0.1.4"

# Embeds the .exe icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Do NOT set panic = "abort": the hook callbacks rely on catch_unwind so that a bug can
# never unwind across the FFI boundary into Windows.
