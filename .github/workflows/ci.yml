name: build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Build and publish the .exe files first, so nothing below can block the download.
      - run: cargo build --release --bins
      # interception.dll (the user-mode library for the Interception driver) from the official
      # release, placed next to the .exe files. The driver itself is installed by the user.
      - name: fetch interception.dll
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo oblitum/Interception --pattern "Interception.zip" --dir ic
          Expand-Archive ic/Interception.zip -DestinationPath ic/x
          $dll = Get-ChildItem ic/x -Recurse -Filter interception.dll |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { throw "x64 interception.dll not found in the release" }
          Write-Host "using $($dll.FullName)"
          Copy-Item $dll.FullName target/release/interception.dll
      - uses: actions/upload-artifact@v4
        with:
          name: padbridge-windows
          path: |
            target/release/padbridge.exe
            target/release/padbridge-cli.exe
            target/release/interception.dll
            bindings.toml
            README.md
      - name: tests
        run: cargo test
        continue-on-error: true
      - name: lint (Windows code paths)
        run: cargo clippy --all-targets
        continue-on-error: true

  # Builds the same app on Linux and photographs every page, so the layout can be checked
  # without a Windows desktop. The pictures are pushed to the 'screenshots' branch.
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick libxkbcommon-x11-0 libxcursor1 \
            libxrandr2 libxi6 libgl1-mesa-dri libegl1 libgl1 xcompmgr
      - run: cargo build --release --bin padbridge
      - name: photograph each page
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p shots
          Xvfb :99 -screen 0 1400x880x24 &
          export DISPLAY=:99
          sleep 2
          # A colourful stand-in desktop and a compositor, so the Clear theme's transparency
          # is visible in the pictures (the other themes are opaque and unaffected).
          convert -size 1400x880 gradient:'#ff9a8b'-'#3f86ed' \
            -fill 'rgba(255,255,255,0.35)' -draw 'circle 300,250 300,420' \
            -fill 'rgba(20,20,40,0.5)' -draw 'rectangle 700,500 1300,820' \
            -fill white -pointsize 110 -gravity center -annotate +0-120 'DESKTOP' desk.png
          # shown as an ordinary full-screen window underneath (backgrounded: it never exits)
          display -geometry 1400x880+0+0 -borderwidth 0 desk.png &
          sleep 2
          xcompmgr &
          sleep 1
          shoot() {
            name=$1; shift
            env "$@" PADBRIDGE_PROFILE_DIR="$PWD/shot-profiles" ./target/release/padbridge \
              > "shots/$name.log" 2>&1 &
            pid=$!
            sleep 6
            import -window root "shots/$name.png" || true
            kill $pid || true
            wait $pid || true
          }
          for theme in aurora frost; do
            shoot $theme-keyboard PADBRIDGE_THEME=$theme PADBRIDGE_TAB=keyboard PADBRIDGE_SELECT=W
            shoot $theme-mouse PADBRIDGE_THEME=$theme PADBRIDGE_TAB=mouse PADBRIDGE_SELECT=MouseLeft
            shoot $theme-controller PADBRIDGE_THEME=$theme PADBRIDGE_TAB=controller PADBRIDGE_SELECT_OUTPUT=A
            shoot $theme-stick PADBRIDGE_THEME=$theme PADBRIDGE_TAB=stick
            shoot $theme-settings PADBRIDGE_THEME=$theme PADBRIDGE_TAB=settings
          done
          shoot clear-keyboard PADBRIDGE_THEME=clear PADBRIDGE_TAB=keyboard PADBRIDGE_SELECT=W
          shoot clear-controller PADBRIDGE_THEME=clear PADBRIDGE_TAB=controller PADBRIDGE_SELECT_OUTPUT=A
          shoot clear-stick PADBRIDGE_THEME=clear PADBRIDGE_TAB=stick
          shoot clear-settings PADBRIDGE_THEME=clear PADBRIDGE_TAB=settings
          shoot clear-keyboard-opacity-0 PADBRIDGE_THEME=clear PADBRIDGE_OPACITY=0 PADBRIDGE_TAB=keyboard PADBRIDGE_SELECT=W
          shoot clear-keyboard-opacity-100 PADBRIDGE_THEME=clear PADBRIDGE_OPACITY=1 PADBRIDGE_TAB=keyboard PADBRIDGE_SELECT=W
          ls -la shots
      - name: publish screenshots
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then target=screenshots; else target="screenshots-$GITHUB_REF_NAME"; fi
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "screenshots:$target"
